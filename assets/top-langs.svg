      <rect x="130" y="2" width="230" height="8" rx="4" fill="#24283b"/>
      <rect x="130" y="2" width="94" height="8" rx="4" fill="#4F5D95"/>
    </g>
    <g transform="translate(25, 84)">
      <circle cx="6" cy="6" r="5" fill="#b07219" />
