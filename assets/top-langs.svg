      <text x="390" y="10" class="lang-pct" text-anchor="end">68.8%</text>
      <rect x="130" y="2" width="200" height="8" rx="4" fill="#21262d"/>
      <rect x="130" y="2" width="137" height="8" rx="4" fill="#00ADD8"/>
    </g>
    <g transform="translate(25, 84)">
      <circle cx="6" cy="6" r="5" fill="#3178c6" />
