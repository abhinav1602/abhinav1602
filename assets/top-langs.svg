      <rect x="130" y="2" width="200" height="8" rx="4" fill="#21262d"/>
      <rect x="130" y="2" width="20" height="8" rx="4" fill="#f1e05a"/>
    </g>
    <g transform="translate(25, 132)">
      <circle cx="6" cy="6" r="5" fill="#3572A5" />
      <text x="18" y="10" class="lang-name">Python</text>
      <text x="390" y="10" class="lang-pct" text-anchor="end">1.1%</text>
      <rect x="130" y="2" width="200" height="8" rx="4" fill="#21262d"/>
      <rect x="130" y="2" width="4" height="8" rx="4" fill="#3572A5"/>
    </g>
    <g transform="translate(25, 156)">
      <circle cx="6" cy="6" r="5" fill="#563d7c" />
      <text x="18" y="10" class="lang-name">CSS</text>
      <text x="390" y="10" class="lang-pct" text-anchor="end">1.0%</text>
      <rect x="130" y="2" width="200" height="8" rx="4" fill="#21262d"/>
      <rect x="130" y="2" width="4" height="8" rx="4" fill="#563d7c"/>
