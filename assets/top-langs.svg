      <text x="390" y="10" class="lang-pct" text-anchor="end">15.4%</text>
      <rect x="130" y="2" width="200" height="8" rx="4" fill="#21262d"/>
      <rect x="130" y="2" width="30" height="8" rx="4" fill="#3178c6"/>
    </g>
    <g transform="translate(25, 108)">
      <circle cx="6" cy="6" r="5" fill="#f1e05a" />
      <text x="18" y="10" class="lang-name">JavaScript</text>
