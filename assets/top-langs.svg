    <g transform="translate(25, 180)">
      <circle cx="6" cy="6" r="5" fill="#e34c26" />
      <text x="18" y="10" class="lang-name">HTML</text>
      <text x="390" y="10" class="lang-pct" text-anchor="end">0.8%</text>
      <rect x="130" y="2" width="200" height="8" rx="4" fill="#21262d"/>
