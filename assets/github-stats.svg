<svg width="450" height="220" viewBox="0 0 450 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: 600 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #58a6ff; }
    .stat-label { font: 500 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #f0f6fc; }
    .stat-value { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #a5d6ff; }
    .border { stroke: #30363d; stroke-width: 1; }
    .bg { fill: #0d1117; rx: 10px; }
  </style>
  <rect x="1" y="1" width="448" height="218" rx="8" class="bg border"/>
  <text x="25" y="38" class="header">My GitHub Stats</text>

  <g transform="translate(25, 60)">
    <!-- Stars -->
    <g transform="translate(0, 0)">
      <text x="0" y="15" class="stat-label">★ Total Stars Earned:</text>
      <text x="390" y="15" class="stat-value" text-anchor="end">23</text>
    </g>
    <!-- Total Contributions -->
    <g transform="translate(0, 25)">
      <text x="0" y="15" class="stat-label">📦 Total Contributions:</text>
      <text x="390" y="15" class="stat-value" text-anchor="end">2,000+</text>
    </g>
    <!-- Total Commits -->
    <g transform="translate(0, 50)">
      <text x="0" y="15" class="stat-label">📝 Total Commits:</text>
      <text x="390" y="15" class="stat-value" text-anchor="end">1,500+</text>
    </g>
    <!-- Total Repos -->
    <g transform="translate(0, 75)">
      <text x="0" y="15" class="stat-label">📁 Public Repositories:</text>
      <text x="390" y="15" class="stat-value" text-anchor="end">62</text>
    </g>
    <!-- Total Forks -->
    <g transform="translate(0, 100)">
      <text x="0" y="15" class="stat-label">🍴 Total Forks:</text>
      <text x="390" y="15" class="stat-value" text-anchor="end">10</text>
    </g>
    <!-- PRs & Issues -->
    <g transform="translate(0, 125)">
      <text x="0" y="15" class="stat-label">🔀 Pull Requests &amp; Issues:</text>
      <text x="390" y="15" class="stat-value" text-anchor="end">50+ PRs / 20+ Issues</text>
    </g>
  </g>
</svg>