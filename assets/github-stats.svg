<svg width="450" height="230" viewBox="0 0 450 230" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <style>
    .header { font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #7aa2f7; }
    .stat-label { font: 500 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #a9b1d6; }
    .stat-value { font: 700 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #bb9af7; }
    .border { stroke: #3b4261; stroke-width: 1.5; }
    .bg { fill: #1a1b26; rx: 12px; }
  </style>
  <rect x="1" y="1" width="448" height="228" class="bg border"/>
  <text x="25" y="38" class="header">My GitHub Stats</text>

  <g transform="translate(25, 62)">
    <g transform="translate(0, 0)">
      <text x="0" y="15" class="stat-label">★ Total Stars Earned:</text>
      <text x="390" y="15" class="stat-value" text-anchor="end">22</text>
    </g>
    <g transform="translate(0, 26)">
      <text x="0" y="15" class="stat-label">📦 Lifetime Contributions:</text>
      <text x="390" y="15" class="stat-value" text-anchor="end">1,200+</text>
    </g>
    <g transform="translate(0, 52)">
      <text x="0" y="15" class="stat-label">🔨 Total Commits:</text>
      <text x="390" y="15" class="stat-value" text-anchor="end">800+</text>
    </g>
    <g transform="translate(0, 78)">
      <text x="0" y="15" class="stat-label">📁 Public Repositories:</text>
      <text x="390" y="15" class="stat-value" text-anchor="end">62</text>
    </g>
    <g transform="translate(0, 104)">
      <text x="0" y="15" class="stat-label">🍴 Total Forks:</text>
      <text x="390" y="15" class="stat-value" text-anchor="end">9</text>
    </g>
    <g transform="translate(0, 130)">
      <text x="0" y="15" class="stat-label">👥 Followers:</text>
      <text x="390" y="15" class="stat-value" text-anchor="end">36</text>
    </g>
  </g>
</svg>