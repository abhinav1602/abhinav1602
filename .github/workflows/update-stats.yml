name: Update Profile Stats Cards

on:
  schedule:
    - cron: '*/30 * * * *' # Every 30 minutes (GitHub may delay scheduled runs)
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Stats SVGs
        env:
          # STATS_TOKEN: a personal access token, so private contributions count.
          # Falls back to the built-in token (public contributions only) if unset.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_stats.py

      - name: Commit and Push Updated Stats
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update profile statistics [skip ci]"
          file_pattern: "assets/*.svg"
